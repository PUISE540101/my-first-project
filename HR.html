<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鼎新風格 - 人事排班管理系統</title>
    <style>
        :root {
            --primary-color: #0f766e;       /* 鼎新常見的專業深青綠色調 */
            --primary-hover: #115e59;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            
            /* 班別顏色 */
            --shift-early: #dbeafe;   /* 早班 - 藍 */
            --shift-mid: #fef08a;     /* 中班 - 黃 */
            --shift-night: #fed7aa;   /* 晚班 - 橘 */
            --shift-off: #f1f5f9;     /* 休假 - 灰 */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 1px 3px rgb(0 0 0 / 0.1);
        }

        /* 頂部導覽列 */
        .erp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            margin: 0;
            font-size: 1.25rem;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        button, select, input {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.85rem;
            background: #fff;
            cursor: pointer;
        }

        button.primary-btn {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        button.primary-btn:hover {
            background-color: var(--primary-hover);
        }

        /* 圖例說明列 */
        .legend-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            align-items: center;
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }

        /* 矩陣排班大表外框 (支援橫向捲動) */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #fff;
            margin-bottom: 16px;
        }

        .erp-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .erp-table th, .erp-table td {
            border: 1px solid var(--border-color);
            padding: 6px 4px;
            height: 32px;
        }

        .erp-table th {
            background-color: #f1f5f9;
            font-weight: 600;
            color: #334155;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .erp-table th.emp-col, .erp-table td.emp-col {
            position: sticky;
            left: 0;
            background-color: #f8fafc;
            z-index: 11;
            width: 90px;
            font-weight: 600;
            text-align: left;
            padding-left: 8px;
        }

        .erp-table th.emp-col {
            z-index: 20;
            background-color: #e2e8f0;
        }

        /* 儲存格互動 */
        .shift-cell {
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
            font-weight: 500;
        }

        .shift-cell:hover {
            opacity: 0.8;
            outline: 2px solid var(--primary-color);
        }

        /* 班別對應顏色 */
        .shift-cell[data-shift="early"] { background-color: var(--shift-early); color: #1e40af; }
        .shift-cell[data-shift="mid"] { background-color: var(--shift-mid); color: #854d0e; }
        .shift-cell[data-shift="night"] { background-color: var(--shift-night); color: #9a3412; }
        .shift-cell[data-shift="off"] { background-color: var(--shift-off); color: #64748b; }

        /* 員工管理區塊 */
        .management-panel {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .panel-box {
            flex: 1;
            min-width: 280px;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            background: #fafafa;
        }

        .panel-box h3 {
            margin-top: 0;
            font-size: 0.95rem;
            color: #334155;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .emp-manage-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: 8px;
        }

        .emp-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 4px 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.75rem;
        }

        .add-form {
            display: flex;
            gap: 6px;
        }

        .add-form input {
            flex-grow: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 頂部資訊與月份切換 -->
    <div class="erp-header">
        <h1>🏢 鼎新風格人事排班系統</h1>
        <div class="toolbar">
            <button onclick="changeMonth(-1)">◀ 上個月</button>
            <span id="month-year-display" style="font-weight: 600; font-size: 1rem; min-width: 90px; text-align: center;"></span>
            <button onclick="changeMonth(1)">下個月 ▶</button>
            <button class="primary-btn" onclick="exportToCSV()">📥 匯出 Excel (CSV)</button>
        </div>
    </div>

    <!-- 班別代號圖例 -->
    <div class="legend-bar">
        <span><b>操作說明：</b>點擊表格中的格子可直接循環切換班別 ➔</span>
        <div class="legend-item"><div class="legend-color" style="background: var(--shift-early);"></div>早</div>
        <div class="legend-item"><div class="legend-color" style="background: var(--shift-mid);"></div>中</div>
        <div class="legend-item"><div class="legend-color" style="background: var(--shift-night);"></div>晚</div>
        <div class="legend-item"><div class="legend-color" style="background: var(--shift-off);"></div>休</div>
    </div>

    <!-- 矩陣排班大表 -->
    <div class="table-responsive">
        <table class="erp-table" id="schedule-table">
            <!-- 動態生成 -->
        </table>
    </div>

    <!-- 基礎人事管理面板 -->
    <div class="management-panel">
        <div class="panel-box">
            <h3>👥 員工名單維護</h3>
            <div class="emp-manage-list" id="emp-manage-list"></div>
            <div class="add-form">
                <input type="text" id="new-emp-input" placeholder="輸入新員工姓名...">
                <button class="primary-btn" onclick="addEmployee()">新增</button>
            </div>
        </div>
        <div class="panel-box">
            <h3>💡 系統提示</h3>
            <p style="font-size: 0.8rem; color: #64748b; line-height: 1.4; margin: 0;">
                1. 點擊「匯出 Excel (CSV)」可將當月份排班表下載並直接用 Excel 開啟。<br>
                2. 表格支援手機左右滑動，左側員工姓名欄位已鎖定固定。<br>
                3. 所有資料會自動儲存於瀏覽器的 LocalStorage 中。
            </p>
        </div>
    </div>
</div>

<script>
    let currentDate = new Date();

    function getEmployees() {
        const data = localStorage.getItem('erp_employees');
        return data ? JSON.parse(data) : ['王小明', '李小華', '張大山', '陳美麗', '林志偉'];
    }

    function saveEmployees(emps) {
        localStorage.setItem('erp_employees', JSON.stringify(emps));
        initApp();
    }

    const shifts = [
        { key: '', label: '' },
        { key: 'early', label: '早' },
        { key: 'mid', label: '中' },
        { key: 'night', label: '晚' },
        { key: 'off', label: '休' }
    ];

    function changeMonth(direction) {
        currentDate.setMonth(currentDate.getMonth() + direction);
        initApp();
    }

    function getStorageKey(year, month) {
        return `erp_schedule_${year}_${month}`;
    }

    function getMonthData(year, month) {
        const data = localStorage.getItem(getStorageKey(year, month));
        return data ? JSON.parse(data) : {};
    }

    function saveMonthData(year, month, data) {
        localStorage.setItem(getStorageKey(year, month), JSON.stringify(data));
    }

    function initApp() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        document.getElementById('month-year-display').textContent = `${year} 年 ${month + 1} 月`;

        renderMatrixTable(year, month);
        renderEmpManagement();
    }

    function renderMatrixTable(year, month) {
        const table = document.getElementById('schedule-table');
        table.innerHTML = '';

        const totalDays = new Date(year, month + 1, 0).getDate();
        const employees = getEmployees();
        const monthData = getMonthData(year, month);

        let headerTr = document.createElement('tr');
        let thEmp = document.createElement('th');
        thEmp.className = 'emp-col';
        thEmp.textContent = '員工 / 日期';
        headerTr.appendChild(thEmp);

        for (let day = 1; day <= totalDays; day++) {
            let th = document.createElement('th');
            let weekDay = new Date(year, month, day).getDay();
            let weekChars = ['日', '一', '二', '三', '四', '五', '六'];
            th.innerHTML = `${day}<br><span style="font-size:0.7rem; color:#64748b;">${weekChars[weekDay]}</span>`;
            if (weekDay === 0 || weekDay === 6) {
                th.style.color = '#dc2626';
            }
            headerTr.appendChild(th);
        }

        ['早', '中', '晚', '休'].forEach(s => {
            let th = document.createElement('th');
            th.textContent = s;
            headerTr.appendChild(th);
        });
        table.appendChild(headerTr);

        employees.forEach(emp => {
            if (!monthData[emp]) monthData[emp] = {};

            let tr = document.createElement('tr');
            let tdEmp = document.createElement('td');
            tdEmp.className = 'emp-col';
            tdEmp.textContent = emp;
            tr.appendChild(tdEmp);

            let counts = { early: 0, mid: 0, night: 0, off: 0 };

            for (let day = 1; day <= totalDays; day++) {
                let td = document.createElement('td');
                td.className = 'shift-cell';
                
                let currentKey = monthData[emp][day] || '';
                if (currentKey && counts[currentKey] !== undefined) {
                    counts[currentKey]++;
                }
                
                let shiftObj = shifts.find(s => s.key === currentKey);
                td.textContent = shiftObj ? shiftObj.label : '';
                if (currentKey) td.setAttribute('data-shift', currentKey);

                td.addEventListener('click', () => {
                    let curKey = monthData[emp][day] || '';
                    let curIdx = shifts.findIndex(s => s.key === curKey);
                    let nextIdx = (curIdx + 1) % shifts.length;
                    let nextShift = shifts[nextIdx];

                    if (nextShift.key === '') {
                        delete monthData[emp][day];
                        td.removeAttribute('data-shift');
                    } else {
                        monthData[emp][day] = nextShift.key;
                        td.setAttribute('data-shift', nextShift.key);
                    }

                    td.textContent = nextShift.label;
                    saveMonthData(year, month, monthData);
                    renderMatrixTable(year, month);
                });

                tr.appendChild(td);
            }

            ['early', 'mid', 'night', 'off'].forEach(key => {
                let tdStat = document.createElement('td');
                tdStat.textContent = counts[key];
                tdStat.style.fontWeight = '600';
                tdStat.style.backgroundColor = '#f8fafc';
                tr.appendChild(tdStat);
            });

            table.appendChild(tr);
        });
    }

    function renderEmpManagement() {
        const listEl = document.getElementById('emp-manage-list');
        const emps = getEmployees();
        listEl.innerHTML = '';

        emps.forEach(emp => {
            let row = document.createElement('div');
            row.className = 'emp-row';
            row.innerHTML = `
                <span>${emp}</span>
                <button class="delete-btn" onclick="deleteEmployee('${emp}')">刪除</button>
            `;
            listEl.appendChild(row);
        });
    }

    function addEmployee() {
        const input = document.getElementById('new-emp-input');
        const name = input.value.trim();
        if (!name) return;

        let emps = getEmployees();
        if (emps.includes(name)) {
            alert('此員工已存在！');
            return;
        }

        emps.push(name);
        saveEmployees(emps);
        input.value = '';
    }

    function deleteEmployee(name) {
        if (!confirm(`確定要刪除員工「${name}」嗎？`)) return;
        let emps = getEmployees();
        emps = emps.filter(e => e !== name);
        saveEmployees(emps);
    }

    // 匯出 CSV 功能
    function exportToCSV() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const totalDays = new Date(year, month + 1, 0).getDate();
        const employees = getEmployees();
        const monthData = getMonthData(year, month);

        let csvRows = [];

        // 1. 表頭 (員工, 1號, 2號, ..., 總早, 總中, 總晚, 總休)
        let header = ['員工'];
        for (let day = 1; day <= totalDays; day++) {
            header.push(`${day}日`);
        }
        header.push('總早班', '總中班', '總晚班', '總休假');
        csvRows.push(header.join(','));

        // 2. 內容資料
        employees.forEach(emp => {
            let row = [ `"${emp}"` ];
            let counts = { early: 0, mid: 0, night: 0, off: 0 };

            for (let day = 1; day <= totalDays; day++) {
                let key = monthData[emp] && monthData[emp][day] ? monthData[emp][day] : '';
                let label = '';
                if (key === 'early') { label = '早'; counts.early++; }
                else if (key === 'mid') { label = '中'; counts.mid++; }
                else if (key === 'night') { label = '晚'; counts.night++; }
                else if (key === 'off') { label = '休'; counts.off++; }
                row.push(`"${label}"`);
            }

            // 加入統計
            row.push(counts.early, counts.mid, counts.night, counts.off);
            csvRows.push(row.join(','));
        });

        // 3. 轉成 Blob 並下載 (加上 UTF-8 BOM 避免 Excel 亂碼)
        const csvString = '\uFEFF' + csvRows.join('\n');
        const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `排班表_${year}年${month + 1}月.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    initApp();
</script>

</body>
</html>
