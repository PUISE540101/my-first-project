<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR web service</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Segoe UI", sans-serif;
      background: #f4f6f9;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ========== 頂部導覽 ========== */
    .navbar {
      background: #1c2834;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      z-index: 100;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .logo {
      width: 26px;
      height: 26px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #1c2834;
      font-weight: 700;
    }

    .nav-item {
      color: #a8b5c0;
      font-size: 14.5px;
      padding: 0;
      position: relative;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      height: 50px;
      line-height: 50px;
      transition: color 0.15s;
    }

    .nav-item:hover { color: #fff; }

    .nav-item.active {
      color: #fff;
    }

    .nav-item.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: #2e86de;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .flag {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      user-select: none;
    }
    .flag.tw { background: #e74c3c; }
    .flag.th { background: #e67e22; }
    .flag.id { background: #c0392b; }

    /* ========== 頁面容器 ========== */
    .page {
      display: none;
      flex: 1;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .page.active {
      display: flex;
    }

    /* 背景裝飾 */
    .bg-decor {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-wave {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 70% at 15% 25%, rgba(80,140,200,0.035) 0%, transparent 55%),
        radial-gradient(ellipse 80% 60% at 85% 75%, rgba(80,140,200,0.03) 0%, transparent 50%);
    }

    .bg-wave::before {
      content: '';
      position: absolute;
      width: 160%;
      height: 160%;
      top: -30%;
      left: -30%;
      background: repeating-radial-gradient(
        circle at 50% 50%,
        transparent 0,
        transparent 38px,
        rgba(90,130,170,0.025) 39px,
        rgba(90,130,170,0.025) 40px
      );
      transform: rotate(-6deg);
    }

    .tablet {
      position: absolute;
      background: linear-gradient(150deg, #c8ced6, #9aa3b0);
      border-radius: 16px;
      opacity: 0.16;
    }
    .tablet-left {
      width: 170px;
      height: 250px;
      top: 30px;
      left: -50px;
      transform: rotate(-28deg);
    }
    .tablet-right {
      width: 150px;
      height: 220px;
      bottom: 80px;
      right: -40px;
      transform: rotate(20deg);
    }

    /* ========== 首頁 ========== */
    #page-home .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      padding-bottom: 40px;
    }

    .home-title {
      font-size: 42px;
      font-weight: 600;
      color: #2c3e50;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .home-subtitle {
      font-size: 17px;
      color: #8899a6;
    }

    /* ========== 表單頁共用 ========== */
    .form-page-inner {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
      padding: 24px 20px 8px;
    }

    .form-title {
      font-size: 20px;
      font-weight: 600;
      color: #2c3e50;
      letter-spacing: 4px;
      margin-bottom: 18px;
      text-align: center;
    }

    .form-body {
      width: 100%;
      max-width: 680px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 36px;
      row-gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    label {
      font-size: 13px;
      color: #555;
    }

    input[type="text"],
    input[type="password"],
    input[type="datetime-local"],
    select {
      height: 34px;
      padding: 0 10px;
      border: 1px solid #c5cad3;
      border-radius: 4px;
      font-size: 13.5px;
      font-family: inherit;
      color: #333;
      background: #fff;
      outline: none;
      width: 100%;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus, select:focus {
      border-color: #2e86de;
      box-shadow: 0 0 0 2.5px rgba(46,134,222,0.18);
    }

    input:disabled {
      background: #eef0f3;
      color: #999;
    }

    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 36px; }
    .toggle-eye {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      color: #888;
      padding: 2px;
      line-height: 1;
    }

    .emp-focus {
      border-color: #2e86de !important;
      box-shadow: 0 0 0 2px rgba(46,134,222,0.22);
    }

    .date-wrap { position: relative; }
    .date-wrap input { padding-right: 32px; }
    .date-icon {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: #999;
      pointer-events: none;
    }

    /* 按鈕 */
    .btn-area {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    .btn-area.center {
      justify-content: center;
    }

    .btn {
      min-width: 88px;
      height: 32px;
      border: none;
      border-radius: 4px;
      font-size: 13.5px;
      font-family: inherit;
      font-weight: 500;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary {
      background: #2b7de9;
    }
    .btn-primary:hover { background: #1a6ad4; }

    .btn-secondary {
      background: #4a9ef5;
    }
    .btn-secondary:hover { background: #2b7de9; }

    /* 未刷單 申請紀錄按鈕 */
    .btn-record {
      position: absolute;
      top: 24px;
      left: max(20px, calc(50% - 340px));
      min-width: 90px;
      z-index: 5;
    }

    /* 頁尾 */
    .footer {
      flex-shrink: 0;
      text-align: center;
      padding: 12px 0 16px;
      font-size: 12px;
      color: #9aa5b0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
      z-index: 1;
    }

    .footer-logo {
      width: 15px;
      height: 15px;
      background: #9aa5b0;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: #fff;
      font-weight: 700;
    }

    /* 主題按鈕 */
    .theme-toggle {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: #6c5ce7;
      color: #fff;
      border: none;
      border-radius: 16px;
      padding: 6px 13px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 2px 8px rgba(108,92,231,0.35);
      z-index: 200;
    }

    /* 深色模式 */
    body.dark { background: #0f172a; }
    body.dark .navbar { background: #0b1120; }
    body.dark .home-title,
    body.dark .form-title { color: #e2e8f0; }
    body.dark .home-subtitle { color: #94a3b8; }
    body.dark label { color: #94a3b8; }
    body.dark input,
    body.dark select {
      background: #1e293b;
      border-color: #334155;
      color: #e2e8f0;
    }
    body.dark input:disabled {
      background: #0f172a;
      color: #64748b;
    }
    body.dark .footer { color: #64748b; }
    body.dark .footer-logo { background: #64748b; }
    body.dark .tablet { opacity: 0.07; }

    @media (max-width: 700px) {
      .form-grid { grid-template-columns: 1fr; column-gap: 0; }
      .btn-record { position: static; margin: 0 auto 16px; display: block; }
      .form-page-inner { padding-top: 40px; }
      .tablet { display: none; }
    }
  </style>
</head>
<body>

  <!-- 導覽列 -->
  <nav class="navbar">
    <div class="nav-left">
      <div class="logo">S</div>
      <button class="nav-item active" data-page="home" onclick="showPage('home')">首頁</button>
      <button class="nav-item" data-page="leave" onclick="showPage('leave')">請假單</button>
      <button class="nav-item" data-page="missed" onclick="showPage('missed')">未刷單</button>
    </div>
    <div class="nav-right">
      <div class="flag tw">TW</div>
      <div class="flag th">TH</div>
      <div class="flag id">ID</div>
    </div>
  </nav>

  <!-- ===== 首頁 ===== -->
  <div class="page active" id="page-home">
    <div class="bg-decor">
      <div class="bg-wave"></div>
      <div class="tablet tablet-left"></div>
      <div class="tablet tablet-right"></div>
    </div>
    <div class="content">
      <div class="home-title">HR web service</div>
      <div class="home-subtitle">Designed for IT</div>
    </div>
    <div class="footer">
      <span class="footer-logo">S</span>
      © APEX DYNAMICS 2026
    </div>
  </div>

  <!-- ===== 請假單 ===== -->
  <div class="page" id="page-leave">
    <div class="bg-decor">
      <div class="bg-wave"></div>
      <div class="tablet tablet-left"></div>
      <div class="tablet tablet-right"></div>
    </div>
    <div class="form-page-inner">
      <div class="form-title">請假單</div>
      <div class="form-body">
        <form onsubmit="return submitLeave(event)">
          <div class="form-grid">
            <div class="form-group">
              <label>身分證號後四碼</label>
              <div class="password-wrap">
                <input type="password" id="leave-id4" value="••••" maxlength="4">
                <button type="button" class="toggle-eye" onclick="togglePw('leave-id4')">👁</button>
              </div>
            </div>
            <div class="form-group"></div>

            <div class="form-group">
              <label>工號</label>
              <input type="text" id="leave-emp" class="emp-focus" value="d01762">
            </div>
            <div class="form-group">
              <label>部門</label>
              <input type="text" id="leave-dept" disabled>
            </div>

            <div class="form-group">
              <label>姓名</label>
              <input type="text" id="leave-name" disabled>
            </div>
            <div class="form-group">
              <label>1級主管</label>
              <input type="text" id="leave-s1" disabled>
            </div>

            <div class="form-group">
              <label>請假名稱</label>
              <select id="leave-type">
                <option value="" selected disabled>請選擇...</option>
                <option value="事假">事假</option>
                <option value="病假">病假</option>
                <option value="特休">特休</option>
                <option value="婚假">婚假</option>
                <option value="喪假">喪假</option>
                <option value="產假">產假</option>
                <option value="陪產假">陪產假</option>
                <option value="公假">公假</option>
                <option value="補休">補休</option>
              </select>
            </div>
            <div class="form-group">
              <label>2級主管</label>
              <input type="text" id="leave-s2" disabled>
            </div>

            <div class="form-group">
              <label>開始時間</label>
              <div class="date-wrap">
                <input type="datetime-local" id="leave-start" onchange="calcLeaveHours()">
                <span class="date-icon">📅</span>
              </div>
            </div>
            <div class="form-group">
              <label>未休時數</label>
              <input type="text" id="leave-remain" disabled>
            </div>

            <div class="form-group">
              <label>結束時間</label>
              <div class="date-wrap">
                <input type="datetime-local" id="leave-end" onchange="calcLeaveHours()">
                <span class="date-icon">📅</span>
              </div>
            </div>
            <div class="form-group">
              <label>預計請假時數</label>
              <input type="text" id="leave-hours" readonly>
            </div>
          </div>

          <div class="btn-area center">
            <button type="button" class="btn btn-primary" onclick="queryLeave()">查詢</button>
            <button type="submit" class="btn btn-secondary">送出</button>
          </div>
        </form>
      </div>
    </div>
    <div class="footer">
      <span class="footer-logo">S</span>
      © APEX DYNAMICS 2026
    </div>
  </div>

  <!-- ===== 未刷單 ===== -->
  <div class="page" id="page-missed">
    <div class="bg-decor">
      <div class="bg-wave"></div>
      <div class="tablet tablet-left"></div>
      <div class="tablet tablet-right"></div>
    </div>
    <div class="form-page-inner">
      <button class="btn btn-primary btn-record" onclick="alert('申請紀錄（示範）')">申請紀錄</button>
      <div class="form-title">未刷單</div>
      <div class="form-body">
        <form onsubmit="return submitMissed(event)">
          <div class="form-grid">
            <div class="form-group">
              <label>工號</label>
              <input type="text" id="miss-emp">
            </div>
            <div class="form-group">
              <label>身分證號後四碼</label>
              <div class="password-wrap">
                <input type="password" id="miss-id4" maxlength="4">
                <button type="button" class="toggle-eye" onclick="togglePw('miss-id4')">👁</button>
              </div>
            </div>

            <div class="form-group">
              <label>未刷卡原因</label>
              <select id="miss-reason">
                <option value="未帶卡" selected>未帶卡</option>
                <option value="忘記刷卡">忘記刷卡</option>
                <option value="系統異常">系統異常</option>
                <option value="機器故障">機器故障</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div class="form-group">
              <label>未刷卡時間</label>
              <div class="date-wrap">
                <input type="datetime-local" id="miss-time">
                <span class="date-icon">📅</span>
              </div>
            </div>
          </div>

          <div class="btn-area">
            <button type="submit" class="btn btn-primary">送出</button>
          </div>
        </form>
      </div>
    </div>
    <div class="footer">
      <span class="footer-logo">S</span>
      © APEX DYNAMICS 2026
    </div>
  </div>

  <button class="theme-toggle" onclick="document.body.classList.toggle('dark')">Toggle theme</button>

  <script>
    function showPage(name) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + name).classList.add('active');
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.page === name);
      });
    }

    function togglePw(id) {
      const el = document.getElementById(id);
      if (el.type === 'password') {
        el.type = 'text';
        if (el.value === '••••') el.value = '';
      } else {
        el.type = 'password';
      }
    }

    function queryLeave() {
      if (!document.getElementById('leave-emp').value.trim()) {
        alert('請先輸入工號');
        return;
      }
      document.getElementById('leave-dept').value = '資訊部';
      document.getElementById('leave-name').value = '王小明';
      document.getElementById('leave-s1').value = '李主管';
      document.getElementById('leave-s2').value = '陳經理';
      document.getElementById('leave-remain').value = '40';
      alert('查詢成功！已帶出員工資料。');
    }

    function calcLeaveHours() {
      const s = document.getElementById('leave-start').value;
      const e = document.getElementById('leave-end').value;
      if (s && e) {
        const h = (new Date(e) - new Date(s)) / 3600000;
        document.getElementById('leave-hours').value = h > 0 ? h.toFixed(1) : '';
      }
    }

    function submitLeave(e) {
      e.preventDefault();
      const type = document.getElementById('leave-type').value;
      const start = document.getElementById('leave-start').value;
      const end = document.getElementById('leave-end').value;
      if (!type) { alert('請選擇請假名稱'); return false; }
      if (!start || !end) { alert('請填寫開始與結束時間'); return false; }
      alert('請假單已送出！\n請假類型：' + type + '\n開始：' + start + '\n結束：' + end);
      return false;
    }

    function submitMissed(e) {
      e.preventDefault();
      const emp = document.getElementById('miss-emp').value.trim();
      const reason = document.getElementById('miss-reason').value;
      const time = document.getElementById('miss-time').value;
      if (!emp) { alert('請輸入工號'); return false; }
      if (!time) { alert('請選擇未刷卡時間'); return false; }
      alert('未刷單已送出！\n工號：' + emp + '\n原因：' + reason + '\n時間：' + time);
      return false;
    }
  </script>
</body>
</html>
